# スマホから「この銘柄も調べて」と頼む仕組み
# 公開ページのボタン → GitHub の「Issue（依頼メモ）」を作る → ここが動いて計算し、毎日調べる銘柄に追加する
# いたずら防止のため、このリポジトリの持ち主が作った依頼だけ受け付ける
name: 銘柄の追加依頼

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: auto-run
  cancel-in-progress: false

jobs:
  add:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '調べて')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Tokyo
      PYTHONIOENCODING: utf-8
      TITLE: ${{ github.event.issue.title }}
      GH_TOKEN: ${{ github.token }}
      NUM: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 計算して追加
        run: |
          CODES=$(echo "$TITLE" | grep -oE '\b[0-9][0-9A-Z]{3}\b' | tr '\n' ' ')
          python build_lookup.py $CODES
          git config user.name "kabu-bot"
          git config user.email "kabu-bot@users.noreply.github.com"
          git add -A docs 気になる銘柄.json 結果
          git diff --cached --quiet || git commit -m "気になる銘柄を追加: $CODES"
          for i in 1 2 3; do git pull --rebase -X ours && git push && break; sleep 5; done
          gh issue close "$NUM" -c "追加しました（$CODES）。1〜2分後に公開ページで見られます。これからは毎日自動で更新します。"
